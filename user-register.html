
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | ShineClean</title>
    <link rel="stylesheet" href="home.css">
    <link rel="stylesheet" href="user-auth.css">
    <script src="user-login.js" defer></script>
</head>
<body class="auth-page">

    <header class="navbar">
        <a href="home.html" class="brand">
            <span class="brand-icon">S</span>
            ShineClean
        </a>
        <a href="user-login.html" class="back-home">Back to Login</a>
    </header>

    <main class="auth-container">
        <section class="auth-card">
            <div class="auth-logo">S</div>
            <p class="auth-eyebrow">JOIN SHINECLEAN</p>
            <h1>Create Account</h1>
            <p class="auth-description">
                Create your account to manage your cleaning bookings.
            </p>

            <form id="userRegisterForm">
                <label for="registerName">Full Name</label>
                <input type="text" id="registerName"
                       placeholder="Enter your full name" required>

                <label for="registerMobile">Mobile Number</label>
                <input type="tel" id="registerMobile"
                       placeholder="Enter 10-digit mobile number"
                       pattern="[0-9]{10}" maxlength="10" required>

                <label for="registerAddress">Address</label>
                <input type="text" id="registerAddress"
                       placeholder="Enter your home address" required>

                <label for="registerPassword">Create Password</label>
                <input type="password" id="registerPassword"
                       placeholder="At least 6 characters"
                       minlength="6" required>

                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword"
                       placeholder="Re-enter your password" required>

                <p id="registerMessage" class="form-message"></p>

                <button type="submit" class="auth-submit">
                    Create Account
                </button>
            </form>

            <p class="account-prompt">
                Already have an account?
                <a href="user-login.html">Login</a>
            </p>
        </section>
    </main>

</body>
</html>
